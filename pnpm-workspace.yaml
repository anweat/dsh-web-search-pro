packages:
  - .
autoInstallPeers: false
allowBuilds:
  '@jackwener/opencli': false
minimumReleaseAgeExclude:
  - '@deepseek-ai/dsh-credentials@0.1.1-rc.2'
  - '@deepseek-ai/dsh-settings@0.1.1-rc.2'
  - '@deepseek-ai/dsh-system-prompt@0.1.1-rc.2'
  - '@deepseek-ai/dsh-tools@0.1.1-rc.2'
  - '@deepseek-ai/dsh-web@0.1.1-rc.2'
  # First-party companion plugin: release browser before Web Search Pro, then
  # allow CI to consume first-party browser releases without the public-package
  # maturity delay. All third-party packages keep the default age gate.
  - '@anweat/dsh-browser'
