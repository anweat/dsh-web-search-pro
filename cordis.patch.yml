# dsh-web-search-pro bundle patch — installs the plugin as one more row over
# the active profile. Install with:
#   dsh plugin --profile <name> add dsh-web-search-pro
# then boot the profile (the web profile has HMR disabled, so a restart applies it).
#
# Live-config: the $DSH_HOME/settings.yaml `web-search-pro:` section overlays
# this entry without a reload (keys / engines / ttl / maxResults).
- insert:
    - id: web-search-pro
      name: dsh-web-search-pro
      config:
        verbose: false
